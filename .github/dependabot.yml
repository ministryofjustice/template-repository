---
version: 2

updates:
  - package-ecosystem: "apm"
    commit-message:
      include: "scope"
      prefix: ":dependabot: apm"
    cooldown:
      default-days: 7
      exclude:
        - "ministryofjustice/*"
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "devcontainers"
    commit-message:
      include: "scope"
      prefix: ":dependabot: devcontainers"
    cooldown:
      default-days: 7
      exclude:
        - "ghcr.io/ministryofjustice/*"
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    commit-message:
      include: "scope"
      prefix: ":dependabot: github-actions"
    cooldown:
      default-days: 7
      exclude:
        - "ministryofjustice/*"
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "pre-commit"
    commit-message:
      include: "scope"
      prefix: ":dependabot: pre-commit"
    cooldown:
      default-days: 7
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
